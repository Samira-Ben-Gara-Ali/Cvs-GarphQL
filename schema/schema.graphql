type Query{
    users: [User]!
    cvs: [Cv]!
    skills: [Skill]!
    user(id: ID!): User
    cv(id: ID!): Cv
    skill(id: ID!): Skill
    roles: [Role]!
    role(id: ID!): Role
}

type Cv{
    id: ID!
    name: String!
    age: Int
    job: String
    user: User!
    skills: [Skill]!
}

type Skill{
    id: ID!
    designation: String!
    cvs: [Cv]!
}

type User{
    id: ID!
    username: String!
    email: String
    role:Role!
    cvs: [Cv]!
}

enum Role {
    USER
    ADMIN
}

# --- Input types ---

input AddUserInput {
    username: String!
    email: String!
    password: String!
}

input UpdateUserInput {
    id: ID!
    username: String
    email: String
    password: String
}

input AddRoleInput {
    name: String!
}

input UpdateRoleInput {
    id: ID!
    name: String
}

input AddSkillInput {
    designation: String!
}

input UpdateSkillInput {
    id: ID!
    designation: String
}

input AddCvInput {
    name: String!
    firstname: String!
    age: Int!
    cin: Int!
    job: String!
    path: String
    userId: ID!
    skillIds: [ID]!
}

input UpdateCvInput {
    id: ID!
    name: String
    firstname: String
    age: Int
    cin: Int
    job: String
    path: String
    userId: ID!
    skillIds: [ID]!
}

# --- Mutation type ---

type Mutation {
    addUser(input: AddUserInput!): User!
    updateUser(input: UpdateUserInput!): User!
    deleteUser(id: ID!): User!

    addRole(input: AddRoleInput!): Role!
    updateRole(input: UpdateRoleInput!): Role!
    deleteRole(id: ID!): Role!

    addSkill(input: AddSkillInput!): Skill!
    updateSkill(input: UpdateSkillInput!): Skill!
    deleteSkill(id: ID!): Skill!

    addCv(input: AddCvInput!): Cv!
    updateCv(input: UpdateCvInput!): Cv!
    deleteCv(id: ID!): Cv!
}

enum CvMutationType {
    ADDED
    UPDATED
    DELETED
}

type CvSubscriptionPayload {
    mutationType: CvMutationType!
    cv: Cv!
}

type Subscription {
    cvChanged: CvSubscriptionPayload!
}